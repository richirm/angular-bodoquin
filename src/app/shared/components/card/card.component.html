<div class="card">
    <div class="card-header">
        <div class="card-header-porcentage">{{ percentage * 100}}%</div>

        <div class="card-header-image">
            <img src="assets/img/{{ imageUrl }}">

        </div>
    </div>

    <div class="card-body">
        <div class="card-body-title">{{ title}}</div>
        <div class="card-body-subtitle" title="{{ subtitle}}">{{subtitle}}</div>
        <div class="card-body-offer">s/. {{ ( 1 -percentage)*price | number:'1.2-2'}}</div>
        <div class="card-body-price">s/. {{ price | number: '1.2-2' }}</div>
    </div>

    <div class="card-footer">
        <button type="button">agregar</button>
    </div>
</div>
